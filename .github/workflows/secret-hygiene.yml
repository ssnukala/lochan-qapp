name: Secret hygiene

# lochan-qapp is a PUBLIC repo whose bootstrap.sh writes REAL secrets into
# .env. The ONLY thing standing between a first-run developer and a leaked
# credential is a .gitignore rule. That rule is load-bearing, so it gets a
# test rather than a habit.
#
# This gate is written to be provably able to BOTH pass and fail: it asserts
# against known-bad fixtures (files that MUST be ignored) and a known-good
# fixture (.env.example, which MUST stay tracked). A check that can only pass
# is a comment, not a gate.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  secret-hygiene:
    name: .env must be ignored, .env.example must be tracked
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assert secret files are gitignored
        run: |
          set -euo pipefail
          fail=0

          # KNOWN-BAD fixtures: each of these MUST be ignored.
          # We create them so the assertion runs against real paths rather
          # than trusting the .gitignore text to mean what it looks like.
          for f in .env .env.local .env.production secrets.key app.priv; do
            : > "$f"
            if git check-ignore -q "$f"; then
              echo "  ok: $f is ignored"
            else
              echo "::error::$f is NOT gitignored — a real secret here would be committable"
              fail=1
            fi
            rm -f "$f"
          done

          # KNOWN-GOOD fixture: .env.example MUST NOT be ignored, or the
          # template a developer copies would never ship. This is the half
          # that proves the check can distinguish, rather than ignoring
          # everything and reporting success.
          if [ ! -f .env.example ]; then
            echo "::error::.env.example is missing — bootstrap.sh has nothing to copy from"
            fail=1
          elif git check-ignore -q .env.example; then
            echo "::error::.env.example IS ignored — it must ship with the repo"
            fail=1
          else
            echo "  ok: .env.example is tracked"
          fi

          # Nothing resembling a real secret may be committed.
          if git ls-files | grep -qE '(^|/)\.env($|\.)' ; then
            echo "::error::a .env file is TRACKED in git:"
            git ls-files | grep -E '(^|/)\.env($|\.)' >&2
            fail=1
          fi

          [ "$fail" -eq 0 ] || exit 1
          echo "Secret hygiene: all fixtures behaved as required."

      - name: Assert bootstrap.sh leaves no placeholder behind
        run: |
          set -euo pipefail
          # daksh install's validate phase refuses any @critical key still
          # holding a placeholder, so a bootstrap that silently leaves one
          # is a broken first-run. Run it and check the artifact.
          bash bootstrap.sh
          if grep -q "CHANGE_ME" .env; then
            echo "::error::bootstrap.sh left placeholders in .env:"
            grep -n "CHANGE_ME" .env >&2
            exit 1
          fi
          # Re-running must REFUSE rather than rotate secrets under a
          # running stack. Assert the refusal, don't assume it.
          if bash bootstrap.sh 2>/dev/null; then
            echo "::error::bootstrap.sh overwrote an existing .env — it must refuse"
            exit 1
          fi
          echo "bootstrap.sh: generated a complete .env and refused to overwrite it."
